name: CI

# Deploy production only runs on main, so without this nothing validates a
# pull request or a push to a working branch.
on:
  push:
    branches:
      - main
      - codex
  pull_request:
  workflow_dispatch:

concurrency:
  group: ddzhilian-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Build backend
        run: |
          npm ci --include=dev --prefix server
          npm run build --prefix server
